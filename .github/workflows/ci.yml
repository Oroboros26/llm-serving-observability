name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  gate:  # real-LLM regression gate; needs repo secret GROQ_API_KEY
    runs-on: ubuntu-latest
    needs: test
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
        if: env.GROQ_API_KEY != ''
      - name: Current prompt must pass
        if: env.GROQ_API_KEY != ''
        run: python -m eval.gate --prompt prompts/system_v1.txt
      - name: Degraded prompt must be blocked
        if: env.GROQ_API_KEY != ''
        run: |
          if python -m eval.gate --prompt prompts/system_degraded.txt; then
            echo "gate failed to block the degraded prompt"; exit 1
          fi

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm-serving-observability .
