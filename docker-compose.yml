# Image tags are from memory and unverified: check they exist before relying on them.
services:
  app:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [redis]

  redis:
    image: redis:7-alpine

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # Optional self-hosted model (needs an NVIDIA GPU): docker compose --profile vllm up
  # then set UPSTREAM_URL=http://vllm:8000/v1 and MODEL=Qwen/Qwen2.5-1.5B-Instruct in .env
  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:v0.6.3
    command: ["--model", "Qwen/Qwen2.5-1.5B-Instruct"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
